<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071225"/><stop offset=".55" stop-color="#102a46"/><stop offset="1" stop-color="#18204a"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#5ee7ff"/><stop offset="1" stop-color="#8b7cff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<g opacity=".14" stroke="#82a8c9"><path d="M40 105H1160M40 175H1160M40 245H1160M40 315H1160M40 385H1160"/><path d="M120 40V470M240 40V470M360 40V470M480 40V470M600 40V470M720 40V470M840 40V470M960 40V470M1080 40V470"/></g>
<text x="54" y="58" fill="#f5f9ff" font-family="Arial" font-size="33" font-weight="700">EDUPORTFOLIO VISION HUB</text>
<text x="56" y="87" fill="#a9bfd2" font-family="Arial" font-size="15">Student portfolios · projects · faculty feedback · institutional administration</text>
<rect x="55" y="112" width="1090" height="52" rx="14" fill="#0b1b2e" stroke="#29486a"/>
<text x="78" y="144" fill="#5ee7ff" font-family="Arial" font-size="16" font-weight="700">PORTFOLIO PIPELINE</text>
<text x="256" y="144" fill="#eef6ff" font-family="Arial" font-size="15">Student → Project → Faculty Review → Feedback → Portfolio Showcase</text>
<circle cx="1080" cy="138" r="8" fill="#5ee7ff" filter="url(#g)"><animate attributeName="r" values="7;16;7" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="1.5s" repeatCount="indefinite"/></circle>
<!-- dashboard cards -->
<g font-family="Arial">
