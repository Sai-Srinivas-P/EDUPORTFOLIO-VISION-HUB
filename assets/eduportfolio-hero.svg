<g transform="translate(445 205)"><rect width="310" height="130" rx="18" fill="#101d35" stroke="#4d6090"/><text x="24" y="34" fill="#8b7cff" font-size="13" font-weight="700">FACULTY</text><text x="24" y="62" fill="#f5f9ff" font-size="20" font-weight="700">Guide &amp; review</text><text x="24" y="88" fill="#b4bed1" font-size="13">View assigned projects</text><text x="24" y="110" fill="#b4bed1" font-size="13">submit feedback · maintain profile</text></g>
<g transform="translate(835 205)"><rect width="310" height="130" rx="18" fill="#12203b" stroke="#3d6582"/><text x="24" y="34" fill="#64e3b3" font-size="13" font-weight="700">ADMIN</text><text x="24" y="62" fill="#f5f9ff" font-size="20" font-weight="700">Manage the hub</text><text x="24" y="88" fill="#afc5d1" font-size="13">Register users · approve status</text><text x="24" y="110" fill="#afc5d1" font-size="13">review lists · delete records</text></g>
</g>
<!-- animated progress -->
<g transform="translate(55 378)" font-family="Arial">
<text x="0" y="0" fill="#eef6ff" font-size="13" font-weight="700">ACADEMIC PROGRESS STREAM</text>
