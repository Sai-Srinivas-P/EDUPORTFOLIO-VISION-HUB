<circle cx="90" cy="40" r="7" fill="#5ee7ff" filter="url(#g)"><animate attributeName="cx" values="90;1000;90" dur="5s" repeatCount="indefinite"/></circle>
<g fill="#8daac1" font-size="11"><text x="0" y="68">REGISTER</text><text x="235" y="68">PROJECT</text><text x="465" y="68">REVIEW</text><text x="700" y="68">FEEDBACK</text><text x="940" y="68">PORTFOLIO</text></g>
</g>
<rect x="55" y="447" width="1090" height="40" rx="11" fill="#0b1b2e" stroke="#29486a"/>
<text x="78" y="472" fill="#ffcf67" font-family="Arial" font-size="12" font-weight="700">IMPLEMENTATION NOTE</text>
<text x="252" y="472" fill="#a9bfd2" font-family="Arial" font-size="12">The shipped UI is JSP + Spring MVC; the repository does not contain a React frontend.</text>
